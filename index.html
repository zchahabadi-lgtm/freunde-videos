
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freunde Videos – Music Videos</title>
  <script src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #151515;
      color: white;
      font-family: Arial, sans-serif;
    }
    main { max-width: 1000px; margin: auto; }
    h1 { font-size: 26px; }
    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      background: black;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }
    button {
      padding: 12px 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      font-size: 15px;
    }
    #playlist {
      padding: 0;
      list-style: none;
    }
    #playlist li {
      padding: 12px;
      border-bottom: 1px solid #444;
      cursor: pointer;
      overflow-wrap: anywhere;
    }
    #playlist li.active {
      background: #333;
      font-weight: bold;
    }
    #status { color: #ccc; }
  </style>
</head>
<body>
<main>
  <h1>Freunde Videos</h1>
  <p>Music Videos – automatische Wiedergabe</p>

  <p id="status">Videoliste wird geladen …</p>
  <iframe
    id="player"
    src="about:blank"
    title="Freunde Videos Player"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen>
  </iframe>

  <h2 id="currentTitle">Video</h2>
  <div class="controls">
    <button id="previous">⏮ Zurück</button>
    <button id="next">Weiter ⏭</button>
  </div>

  <h2>Wiedergabeliste</h2>
  <ol id="playlist"></ol>
</main>

<script>
const LIBRARY_ID = "774462";
const playerFrame = document.getElementById("player");
const statusText = document.getElementById("status");
const titleText = document.getElementById("currentTitle");
const playlistElement = document.getElementById("playlist");

let videos = [];
let currentIndex = 0;
let player = null;
let playerReady = false;
let loadNumber = 0;

function showStatus(message) {
  statusText.textContent = message;
}

function renderPlaylist() {
  playlistElement.replaceChildren();

  videos.forEach((video, index) => {
    const item = document.createElement("li");
    item.textContent = `${index + 1}. ${video.title || "Video " + (index + 1)}`;
    item.className = index === currentIndex ? "active" : "";
    item.addEventListener("click", () => playVideo(index, false));
    playlistElement.appendChild(item);
  });
}

function playVideo(index, autoplay = true) {
  if (index < 0 || index >= videos.length) return;

  currentIndex = index;
  playerReady = false;
  const thisLoad = ++loadNumber;
  const video = videos[index];

  titleText.textContent = `${index + 1} / ${videos.length} – ${video.title || "Video"}`;
  renderPlaylist();
  showStatus("Video wird geladen …");

  playerFrame.src =
    `https://player.mediadelivery.net/embed/${LIBRARY_ID}/${encodeURIComponent(video.guid)}`;

  player = null;

  playerFrame.onload = () => {
    if (thisLoad !== loadNumber) return;

    try {
      player = new playerjs.Player(playerFrame);

      player.on("ready", () => {
        if (thisLoad !== loadNumber) return;
        playerReady = true;
        showStatus(`Video ${index + 1} von ${videos.length}`);

        if (autoplay) {
          player.play();
        }
      });

      player.on("ended", () => {
        if (thisLoad === loadNumber) {
          playVideo(currentIndex + 1, true);
        }
      });
    } catch (error) {
      showStatus("Player konnte nicht gestartet werden. Bitte erneut versuchen.");
    }
  };
}

document.getElementById("previous").addEventListener("click", () => {
  playVideo(currentIndex - 1, true);
});

document.getElementById("next").addEventListener("click", () => {
  playVideo(currentIndex + 1, true);
});

fetch("./bunny-videos.json")
  .then(response => {
    if (!response.ok) throw new Error("Videoliste nicht gefunden");
    return response.json();
  })
  .then(data => {
    videos = Array.isArray(data) ? data : [data];

    // Älteste Upload-Daten zuerst. Bei identischen Zeitstempeln
    // bleibt die Reihenfolge der gelieferten Liste erhalten.
    videos = videos
      .map((video, originalIndex) => ({ video, originalIndex }))
      .sort((a, b) => {
        const dateA = Date.parse(a.video.dateUploaded || "") || 0;
        const dateB = Date.parse(b.video.dateUploaded || "") || 0;
        return dateA - dateB || a.originalIndex - b.originalIndex;
      })
      .map(entry => entry.video)
      .filter(video => video.guid);

    if (videos.length === 0) {
      throw new Error("Keine Videos mit gültiger ID gefunden");
    }

    showStatus(`${videos.length} Videos geladen`);
    playVideo(0, true);
  })
  .catch(error => {
    showStatus("Fehler: " + error.message +
      ". Bitte prüfen, ob bunny-videos.json im Repository liegt.");
  });
</script>
</body>
</html>
